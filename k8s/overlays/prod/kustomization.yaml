# Overlay PROD — hanya compreface-api. Namespace compreface (dibuat oleh mega-facecompare-deploy).
# Ganti "registry.example.internal" dengan host registry internal; untuk rilis, sebaiknya pin digest
# (newTag → digest: sha256:...) dari build/digests.txt hasil scripts/push.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: compreface

resources:
  - ../../base
  - pdb.yaml

images:
  - name: mega/compreface-api
    newName: registry.example.internal/mega/compreface-api
    newTag: "1.2.0"

replicas:
  - name: compreface-api
    count: 2

configMapGenerator:
  - name: compreface-api
    behavior: merge
    literals:
      - READ_TIMEOUT=60000

patches:
  - path: patches/api-resources.yaml
