# Overlay DEV — hanya compreface-api. Namespace compreface-dev (dibuat oleh mega-facecompare-deploy,
# beserta NetworkPolicy default-deny + DNS egress). Ganti "registry.example.internal" dengan host registry internal.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: compreface-dev

resources:
  - ../../base

images:
  - name: mega/compreface-api
    newName: registry.example.internal/mega/compreface-api
    newTag: "1.2.0"

configMapGenerator:
  - name: compreface-api
    behavior: merge
    literals:
      - LOGGING_LEVEL_COM_EXADEL=DEBUG
